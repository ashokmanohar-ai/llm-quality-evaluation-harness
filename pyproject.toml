[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "llm-quality-evaluation-harness"
version = "0.1.0"
description = "A governed, provider-neutral evaluation and regression harness for LLM, RAG, and agentic AI systems."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ashok Kumar Manohar" }]
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
llm-quality = "llm_quality_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_quality_harness"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["llm_quality_harness"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

